<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Store - React</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const produtos = [
            { id: 1, nome: "Tênis Esportivo", preco: "R$ 299,90", img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80" },
            { id: 2, nome: "Relógio Smart", preco: "R$ 499,00", img: "https://images.unsplash.com/photo-1546868871-7041f2a55e12?auto=format&fit=crop&w=500&q=80" },
            { id: 3, nome: "Mochila Casual", preco: "R$ 159,90", img: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=500&q=80" },
            { id: 4, nome: "Fones Bluetooth", preco: "R$ 199,99", img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80" },
            { id: 5, nome: "Câmera Mirrorless", preco: "R$ 3.200,00", img: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=500&q=80" },
            { id: 6, nome: "Óculos de Sol", preco: "R$ 120,00", img: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=500&q=80" }
        ];

        function Navbar({ cartCount }) {
            return (
                <nav className="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
                    <div className="container">
                        <a className="navbar-brand" href="#">Tech Store</a>
                        <button className="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                            <span className="navbar-toggler-icon"></span>
                        </button>
                        <div className="collapse navbar-collapse" id="navbarNav">
                            <ul className="navbar-nav me-auto">
                                <li className="nav-item"><a className="nav-link active" href="#">Início</a></li>
                                <li className="nav-item"><a className="nav-link" href="#">Produtos</a></li>
                                <li className="nav-item"><a className="nav-link" href="#">Contato</a></li>
                            </ul>
                            <button className="btn btn-outline-light d-flex align-items-center">
                                <i className="bi bi-cart3 me-2"></i> Carrinho
                                <span className="badge text-bg-danger ms-2 rounded-pill">{cartCount}</span>
                            </button>
                        </div>
                    </div>
                </nav>
            );
        }

        function ProdutoCard({ produto, onAdicionarAoCarrinho }) {
            const [favorito, setFavorito] = useState(false);

            return (
                <div className="col-12 col-md-6 col-lg-4">
                    <div className="card h-100 shadow-sm">
                        <img src={produto.img} className="card-img-top" style={{height: '200px', objectFit: 'cover'}} alt={produto.nome} />
                        <div className="card-body d-flex flex-column">
                            <h5 className="card-title">{produto.nome}</h5>
                            <p className="card-text text-muted">{produto.preco}</p>
                            <div className="mt-auto d-flex gap-2">
                                <button
                                    className={favorito ? 'btn btn-danger' : 'btn btn-outline-danger'}
                                    onClick={() => setFavorito(!favorito)}
                                >
                                    {favorito ? '♥ Favorito' : '♡ Favoritar'}
                                </button>
                                <button onClick={onAdicionarAoCarrinho} className="btn btn-primary flex-grow-1">
                                    <i className="bi bi-plus-circle me-1"></i> Adicionar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [cartCount, setCartCount] = useState(0);

            return (
                <div>
                    <Navbar cartCount={cartCount} />
                    <div className="container my-5">
                        <h2 className="text-center mb-4">Nossos Produtos</h2>
                        <div className="row g-4">
                            {produtos.map(p => (
                                <ProdutoCard key={p.id} produto={p} onAdicionarAoCarrinho={() => setCartCount(cartCount + 1)} />
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
